name: Dependabot wrangler types

on:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - wrangler.jsonc

permissions:
  contents: write
  pull-requests: write

jobs:
  cf-typegen:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          version: 11.24.0
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm cf-typegen
      - name: Commit regenerated types
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker-configuration.d.ts
          if git diff --cached --quiet; then
            echo "wrangler types are already up to date"
            exit 0
          fi
          git commit -m "chore: regenerate wrangler types"
          git push
